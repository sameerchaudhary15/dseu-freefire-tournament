<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — DSEU Free Fire Esports Tournament</title>
  <meta name="description" content="Restricted area — tournament organisers only.">

  <!-- Browser tab icon (fire bolt) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0a12'/><path fill='%23ff6b00' d='M60 10 26 58h20l-6 32 36-46H54z'/></svg>">

  <!-- Google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body class="page-wrap">

  <!-- ============ ICON SPRITE ============ -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  </svg>

  <!-- ============ NAVBAR ============ -->
  <header class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo"><svg class="icon"><use href="#icon-zap"/></svg></span>
        <span class="brand-text">DSEU<span>ESPORTS</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <ul>
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="register.html" class="nav-link">Register</a></li>
          <li><a href="admin-login.html" class="nav-link active">Admin Login</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <svg class="icon icon-menu"><use href="#icon-menu"/></svg>
        <svg class="icon icon-x"><use href="#icon-x"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- ============ ADMIN LOGIN ============ -->
    <section class="auth-wrap">
      <div class="container">
        <div class="auth-card glass-card">

          <div class="auth-icon"><svg class="icon"><use href="#icon-lock"/></svg></div>
          <h1 class="auth-title">Admin <span class="grad-text">Access</span></h1>
          <p class="auth-sub">Restricted area — only tournament organisers can enter.</p>

          <!-- Username + Password form (filled by js/admin-login.js) -->
          <form class="auth-form" id="loginForm" novalidate>

            <div class="auth-field">
              <label for="username">Username <span class="req">*</span></label>
              <div class="input-wrap">
                <svg class="icon lead-icon"><use href="#icon-user"/></svg>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter username" maxlength="40">
              </div>
            </div>

            <div class="auth-field">
              <label for="password">Password <span class="req">*</span></label>
              <div class="input-wrap">
                <svg class="icon lead-icon"><use href="#icon-lock"/></svg>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter password" maxlength="40">
                <button type="button" class="toggle-btn" id="togglePw" aria-label="Show password" title="Show / hide password">
                  <svg class="icon icon-eye-open"><use href="#icon-eye"/></svg>
                  <svg class="icon icon-eye-closed"><use href="#icon-eye-off"/></svg>
                </button>
              </div>
            </div>

            <!-- Same message is shown for a wrong username OR wrong password -->
            <p class="error-msg" id="loginError">Invalid username or password.</p>

            <button type="submit" class="btn btn-primary btn-lg auth-btn">Login to Dashboard</button>
            <a href="index.html" class="btn btn-ghost btn-lg back-home">Back to Home</a>
          </form>

        </div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">© <span id="year">2026</span> DSEU Esports Tournament · <a href="index.html" style="color: var(--primary-soft);">Home</a></div>
    </div>
  </footer>

  <!-- ============ SCRIPTS ============ -->
  <script src="js/main.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
